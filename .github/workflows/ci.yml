name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      # actions/setup-go v5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.26.x"
          cache: false
      - name: Install gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Scan publication set and history
        run: PATH="$(go env GOPATH)/bin:$PATH" make secrets

  test:
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26.x", "1.27.x"]
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # actions/checkout v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # actions/setup-go v5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Race
        run: go test -race ./...
      - name: Multi-process contention
        run: AMGO_CONTENTION=1 go test ./internal/store -run TestContentionMultiProcess -count=1
      - name: CGO-free build
        run: CGO_ENABLED=0 go build -trimpath -o dist/amgo ./cmd/amgo
      - name: Startup measurement
        run: go test ./benchmark -run TestStartupDistribution -v
